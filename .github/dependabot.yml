version: 2
updates:
  # vendor/frappe_docker is a third-party subtree; it is excluded below.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-compose:
        patterns:
          - "*"
    exclude-paths:
      - "vendor/frappe_docker/**"
